    <line x1="246" y1="178" x2="246" y2="218" />
    <line x1="252" y1="178" x2="252" y2="218" />
    <line x1="258" y1="178" x2="258" y2="218" />
    <line x1="242" y1="184" x2="262" y2="184" />
    <line x1="242" y1="190" x2="262" y2="190" />
